<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  
  <!-- Load React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Updated to Modern Babel 7 for JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Minimal Icon Replacements for Lucide-React ---
    const TrendingUp = ({ size = 24, style }) => (
      <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
    );
    const TrendingDown = ({ size = 24, style }) => (
      <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
    );
    const Plus = ({ size = 24, style }) => (
      <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    );
    const X = ({ size = 24, style }) => (
      <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    );
    const Zap = ({ size = 24, style }) => (
      <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    );

    // --- Main Component ---
    function FinanceTracker() {
      const [currentMonth, setCurrentMonth] = useState(new Date().toISOString().slice(0, 7));
      const [activeTab, setActiveTab] = useState('overview');
      const [selectedDay, setSelectedDay] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);
      
      const [monthlyData, setMonthlyData] = useState(() => {
        try {
          const saved = localStorage.getItem('financeTrackerData');
          if (saved) {
            return JSON.parse(saved);
          }
        } catch (e) {
          console.log('Failed to load saved data');
        }
        
        const currentMonth = new Date().toISOString().slice(0, 7);
        return {
          [currentMonth]: {
            income: '',
            expenses: {
              rent: '',
              utilities: '',
              groceries: '',
              fun: ''
            },
            customExpenses: {},
            savings: '',
            daily: {}
          }
        };
      });

      const [newExpenseName, setNewExpenseName] = useState('');
      const [newExpenseAmount, setNewExpenseAmount] = useState('');

      useEffect(() => {
        try {
          localStorage.setItem('financeTrackerData', JSON.stringify(monthlyData));
        } catch (e) {
          console.log('Failed to save data');
        }
      }, [monthlyData]);

      const getMonthData = () => monthlyData[currentMonth] || { income: '', expenses: { rent: '', utilities: '', groceries: '', fun: '' }, customExpenses: {}, savings: '', daily: {} };
      
      const updateMonthData = (updates) => {
        setMonthlyData(prev => ({
          ...prev,
          [currentMonth]: { ...getMonthData(), ...updates }
        }));
      };

      const handleIncomeChange = (e) => {
        updateMonthData({ income: e.target.value });
      };

      const handleExpenseChange = (e) => {
        const { name, value } = e.target;
        const data = getMonthData();
        updateMonthData({
          expenses: {
            ...data.expenses,
            [name]: value
          }
        });
      };

      const handleAddCustomExpense = () => {
        if (newExpenseName.trim() === '') {
          alert('Please enter a category name');
          return;
        }
        const id = Date.now().toString();
        const data = getMonthData();
        updateMonthData({
          customExpenses: {
            ...data.customExpenses,
            [id]: { name: newExpenseName, amount: newExpenseAmount }
          }
        });
        setNewExpenseName('');
        setNewExpenseAmount('');
      };

      const handleCustomExpenseChange = (id, field, value) => {
        const data = getMonthData();
        updateMonthData({
          customExpenses: {
            ...data.customExpenses,
            [id]: { ...data.customExpenses[id], [field]: value }
          }
        });
      };

      const handleDeleteCustomExpense = (id) => {
        const data = getMonthData();
        const updated = { ...data.customExpenses };
        delete updated[id];
        updateMonthData({ customExpenses: updated });
      };

      const handleSavingsChange = (e) => {
        updateMonthData({ savings: e.target.value });
      };

      const changeMonth = (offset) => {
        const date = new Date(currentMonth + '-01');
        date.setMonth(date.getMonth() + offset);
        const newMonth = date.toISOString().slice(0, 7);
        setCurrentMonth(newMonth);
        if (!monthlyData[newMonth]) {
          setMonthlyData(prev => ({
            ...prev,
            [newMonth]: {
              income: '',
              expenses: { rent: '', utilities: '', groceries: '', fun: '' },
              customExpenses: {},
              savings: '',
              daily: {}
            }
          }));
        }
      };

      const data = getMonthData();
      const incomeNum = parseFloat(data.income) || 0;
      const defaultSpending = Object.values(data.expenses).reduce((sum, val) => sum + (parseFloat(val) || 0), 0);
      const customSpending = Object.values(data.customExpenses).reduce((sum, exp) => sum + (parseFloat(exp.amount) || 0), 0);
      const totalSpending = defaultSpending + customSpending;
      const autoCalculatedSavings = incomeNum - totalSpending;
      const manualSavings = parseFloat(data.savings) || 0;

      return (
        <div style={{ maxWidth: '500px', margin: '40px auto', background: 'white', padding: '24px', borderRadius: '12px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', fontFamily: 'system-ui, -apple-system, sans-serif' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <div style={{ textAlign: 'center', flex: 1 }}>
              <h1 style={{ fontSize: '28px', fontWeight: 'bold', margin: '0 0 8px 0', color: '#1a1a1a' }}>
                💰 Finance Tracker
              </h1>
              <p style={{ color: '#666', margin: 0 }}>Simple money tracker</p>
            </div>
            
            <div style={{ position: 'relative' }}>
              <button
                onClick={() => setMenuOpen(!menuOpen)}
                style={{
                  background: 'none',
                  border: 'none',
                  fontSize: '24px',
                  cursor: 'pointer',
                  padding: '8px',
                  color: '#666'
                }}
              >
                ⋮
              </button>
              
              {menuOpen && (
                <div style={{
                  position: 'absolute',
                  top: '100%',
                  right: 0,
                  background: 'white',
                  border: '1px solid #ddd',
                  borderRadius: '8px',
                  boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
                  marginTop: '8px',
                  minWidth: '180px',
                  zIndex: 1000
                }}>
                  <button
                    onClick={() => {
                      setMenuOpen(false);
                      if (window.confirm('Are you sure you want to delete ALL data? This cannot be undone!')) {
                        localStorage.removeItem('financeTrackerData');
                        window.location.reload();
                      }
                    }}
                    style={{
                      width: '100%',
                      padding: '12px 16px',
                      border: 'none',
                      background: 'none',
                      cursor: 'pointer',
                      textAlign: 'left',
                      fontSize: '14px',
                      color: '#dc2626',
                      fontWeight: 'bold'
                    }}
                  >
                    🗑️ Clear All Data
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Month Selector */}
          <div style={{
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            marginBottom: '20px',
            padding: '12px',
            background: '#f9f9f9',
            borderRadius: '8px'
          }}>
            <button
              onClick={() => changeMonth(-1)}
              style={{
                padding: '6px 12px',
                border: '1px solid #ddd',
                borderRadius: '4px',
                cursor: 'pointer',
                background: 'white'
              }}
            >
              ← Previous
            </button>
            <span style={{ fontWeight: 'bold', fontSize: '16px', color: '#333' }}>
              {new Date(currentMonth + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
            </span>
            <button
              onClick={() => changeMonth(1)}
              style={{
                padding: '6px 12px',
                border: '1px solid #ddd',
                borderRadius: '4px',
                cursor: 'pointer',
                background: 'white'
              }}
            >
              Next →
            </button>
          </div>

          {/* Tab Navigation */}
          <div style={{
            display: 'flex',
            gap: '8px',
            marginBottom: '20px',
            borderBottom: '2px solid #e5e5e5'
          }}>
            <button
              onClick={() => setActiveTab('overview')}
              style={{
                padding: '12px 24px',
                border: 'none',
                background: 'none',
                cursor: 'pointer',
                fontWeight: activeTab === 'overview' ? 'bold' : 'normal',
                color: activeTab === 'overview' ? '#0284c7' : '#999',
                borderBottom: activeTab === 'overview' ? '3px solid #0284c7' : 'none',
                marginBottom: '-2px',
                fontSize: '14px'
              }}
            >
              📊 Overview
            </button>
            <button
              onClick={() => setActiveTab('savings')}
              style={{
                padding: '12px 24px',
                border: 'none',
                background: 'none',
                cursor: 'pointer',
                fontWeight: activeTab === 'savings' ? 'bold' : 'normal',
                color: activeTab === 'savings' ? '#0284c7' : '#999',
                borderBottom: activeTab === 'savings' ? '3px solid #0284c7' : 'none',
                marginBottom: '-2px',
                fontSize: '14px'
              }}
            >
              🏦 Savings
            </button>
            <button
              onClick={() => setActiveTab('calendar')}
              style={{
                padding: '12px 24px',
                border: 'none',
                background: 'none',
                cursor: 'pointer',
                fontWeight: activeTab === 'calendar' ? 'bold' : 'normal',
                color: activeTab === 'calendar' ? '#0284c7' : '#999',
                borderBottom: activeTab === 'calendar' ? '3px solid #0284c7' : 'none',
                marginBottom: '-2px',
                fontSize: '14px'
              }}
            >
              📅 Calendar
            </button>
          </div>

          {/* Budget Summary Card */}
          <div style={{
            background: autoCalculatedSavings >= 0 ? 'linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%)' : 'linear-gradient(135deg, #fee2e2 0%, #fef3c7 100%)',
            border: `2px solid ${autoCalculatedSavings >= 0 ? '#0284c7' : '#dc2626'}`,
            borderRadius: '12px',
            padding: '20px',
            marginBottom: '20px'
          }}>
            <div style={{ textAlign: 'center' }}>
              <p style={{ fontSize: '13px', color: '#666', margin: '0 0 8px 0', fontWeight: '500' }}>
                💰 YOUR BUDGET STATUS
              </p>
              <h2 style={{
                fontSize: '36px',
                fontWeight: 'bold',
                margin: '0 0 8px 0',
                color: autoCalculatedSavings >= 0 ? '#0284c7' : '#dc2626'
              }}>
                ${Math.abs(autoCalculatedSavings).toFixed(2)}
              </h2>
              <p style={{
                fontSize: '14px',
                color: autoCalculatedSavings >= 0 ? '#0c4a6e' : '#7f1d1d',
                margin: '0 0 12px 0',
                fontWeight: 'bold'
              }}>
                {autoCalculatedSavings >= 0 ? '✅ Money Left' : '⚠️ Over Budget'}
              </p>
              
              <div style={{
                width: '100%',
                height: '10px',
                background: '#e5e5e5',
                borderRadius: '5px',
                overflow: 'hidden',
                marginBottom: '12px'
              }}>
                <div style={{
                  height: '100%',
                  width: incomeNum > 0 ? `${Math.min((totalSpending / incomeNum) * 100, 100)}%` : '0%',
                  background: autoCalculatedSavings >= 0 ? '#22c55e' : '#dc2626',
                  transition: 'width 0.3s ease'
                }}></div>
              </div>

              <div style={{
                display: 'grid',
                gridTemplateColumns: '1fr 1fr 1fr',
                gap: '12px',
                fontSize: '12px'
              }}>
                <div style={{ background: 'rgba(255,255,255,0.5)', padding: '8px', borderRadius: '6px' }}>
                  <p style={{ color: '#666', margin: '0 0 4px 0' }}>Income</p>
                  <p style={{ fontWeight: 'bold', color: '#0284c7', fontSize: '14px', margin: 0 }}>
                    ${incomeNum.toFixed(2)}
                  </p>
                </div>
                <div style={{ background: 'rgba(255,255,255,0.5)', padding: '8px', borderRadius: '6px' }}>
                  <p style={{ color: '#666', margin: '0 0 4px 0' }}>Spent</p>
                  <p style={{ fontWeight: 'bold', color: '#dc2626', fontSize: '14px', margin: 0 }}>
                    ${totalSpending.toFixed(2)}
                  </p>
                </div>
                <div style={{ background: 'rgba(255,255,255,0.5)', padding: '8px', borderRadius: '6px' }}>
                  <p style={{ color: '#666', margin: '0 0 4px 0' }}>Left</p>
                  <p style={{ fontWeight: 'bold', color: autoCalculatedSavings >= 0 ? '#22c55e' : '#dc2626', fontSize: '14px', margin: 0 }}>
                    ${autoCalculatedSavings.toFixed(2)}
                  </p>
                </div>
              </div>

              {incomeNum > 0 && (
                <p style={{ fontSize: '12px', color: '#666', margin: '12px 0 0 0' }}>
                  You've used <strong>{((totalSpending / incomeNum) * 100).toFixed(1)}%</strong> of your monthly budget
                </p>
              )}
            </div>
          </div>

          {/* OVERVIEW TAB */}
          {activeTab === 'overview' && (
            <>
          <div style={{
            background: '#f0f9ff',
            border: '2px solid #0ea5e9',
            borderRadius: '12px',
            padding: '20px',
            marginBottom: '24px'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: '12px' }}>
              <TrendingUp size={20} style={{ color: '#0284c7', marginRight: '8px' }} />
              <label style={{ fontWeight: 'bold', color: '#0c4a6e', fontSize: '14px' }}>Monthly Income</label>
            </div>
            <input
              type="number"
              value={data.income}
              onChange={handleIncomeChange}
              placeholder="0"
              style={{
                width: '100%',
                padding: '10px',
                fontSize: '18px',
                border: '1px solid #0ea5e9',
                borderRadius: '8px',
                boxSizing: 'border-box',
                fontWeight: 'bold',
                color: '#0284c7'
              }}
            />
          </div>

          <div style={{
            background: '#fef2f2',
            border: '2px solid #ef4444',
            borderRadius: '12px',
            padding: '20px',
            marginBottom: '24px'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: '16px' }}>
              <TrendingDown size={20} style={{ color: '#dc2626', marginRight: '8px' }} />
              <label style={{ fontWeight: 'bold', color: '#7f1d1d', fontSize: '14px' }}>Monthly Expenses</label>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {[
                { key: 'rent', label: '🏠 Rent' },
                { key: 'utilities', label: '⚡ Utilities' },
                { key: 'groceries', label: '🛒 Groceries' },
                { key: 'fun', label: '🎮 Fun' }
              ].map(({ key, label }) => (
                <div key={key}>
                  <label style={{ fontSize: '13px', color: '#7f1d1d', fontWeight: '500', display: 'block', marginBottom: '4px' }}>
                    {label}
                  </label>
                  <input
                    type="number"
                    name={key}
                    value={data.expenses[key]}
                    onChange={handleExpenseChange}
                    placeholder="0"
                    style={{
                      width: '100%',
                      padding: '8px',
                      fontSize: '16px',
                      border: '1px solid #fecaca',
                      borderRadius: '6px',
                      boxSizing: 'border-box'
                    }}
                  />
                </div>
              ))}

              {Object.entries(data.customExpenses).map(([id, exp]) => (
                <div key={id}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                    <label style={{ fontSize: '13px', color: '#7f1d1d', fontWeight: '500' }}>
                      {exp.name}
                    </label>
                    <button
                      onClick={() => handleDeleteCustomExpense(id)}
                      style={{
                        background: 'none',
                        border: 'none',
                        cursor: 'pointer',
                        padding: '0',
                        display: 'flex',
                        alignItems: 'center',
                        color: '#dc2626'
                      }}
                    >
                      <X size={16} />
                    </button>
                  </div>
                  <input
                    type="number"
                    value={exp.amount}
                    onChange={(e) => handleCustomExpenseChange(id, 'amount', e.target.value)}
                    placeholder="0"
                    style={{
                      width: '100%',
                      padding: '8px',
                      fontSize: '16px',
                      border: '1px solid #fecaca',
                      borderRadius: '6px',
                      boxSizing: 'border-box'
                    }}
                  />
                </div>
              ))}

              <div style={{ marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #fecaca' }}>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                  <input
                    type="text"
                    value={newExpenseName}
                    onChange={(e) => setNewExpenseName(e.target.value)}
                    placeholder="Category name (e.g., Gas)"
                    onKeyPress={(e) => e.key === 'Enter' && handleAddCustomExpense()}
                    style={{
                      flex: 1,
                      padding: '8px',
                      fontSize: '14px',
                      border: '1px solid #fecaca',
                      borderRadius: '6px',
                      boxSizing: 'border-box'
                    }}
                  />
                  <input
                    type="number"
                    value={newExpenseAmount}
                    onChange={(e) => setNewExpenseAmount(e.target.value)}
                    placeholder="Amount"
                    onKeyPress={(e) => e.key === 'Enter' && handleAddCustomExpense()}
                    style={{
                      width: '100px',
                      padding: '8px',
                      fontSize: '14px',
                      border: '1px solid #fecaca',
                      borderRadius: '6px',
                      boxSizing: 'border-box'
                    }}
                  />
                </div>
                <button
                  onClick={handleAddCustomExpense}
                  style={{
                    width: '100%',
                    padding: '10px',
                    background: '#dc2626',
                    color: 'white',
                    border: 'none',
                    borderRadius: '6px',
                    fontWeight: 'bold',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '6px',
                    fontSize: '14px'
                  }}
                >
                  <Plus size={18} /> Add Expense
                </button>
              </div>
            </div>
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            gap: '12px',
            marginBottom: '20px'
          }}>
            <div style={{
              background: '#fef3c7',
              border: '1px solid #fbbf24',
              borderRadius: '8px',
              padding: '16px',
              textAlign: 'center'
            }}>
              <p style={{ margin: '0 0 8px 0', fontSize: '12px', color: '#92400e', fontWeight: '500' }}>Total Spending</p>
              <p style={{ margin: 0, fontSize: '24px', fontWeight: 'bold', color: '#b45309' }}>
                ${totalSpending.toFixed(2)}
              </p>
            </div>

            <div style={{
              background: autoCalculatedSavings >= 0 ? '#dbeafe' : '#fee2e2',
              border: `1px solid ${autoCalculatedSavings >= 0 ? '#93c5fd' : '#fecaca'}`,
              borderRadius: '8px',
              padding: '16px',
              textAlign: 'center'
            }}>
              <p style={{ margin: '0 0 8px 0', fontSize: '12px', color: autoCalculatedSavings >= 0 ? '#0c4a6e' : '#7f1d1d', fontWeight: '500' }}>
                Remaining
              </p>
              <p style={{
                margin: 0,
                fontSize: '24px',
                fontWeight: 'bold',
                color: autoCalculatedSavings >= 0 ? '#0284c7' : '#dc2626'
              }}>
                ${autoCalculatedSavings.toFixed(2)}
              </p>
            </div>
          </div>

          {totalSpending > 0 && (
            <div style={{
              background: '#f5f5f5',
              borderRadius: '8px',
              padding: '16px',
              fontSize: '13px'
            }}>
              <p style={{ margin: '0 0 8px 0', fontWeight: 'bold', color: '#333' }}>Spending Breakdown</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', color: '#666' }}>
                {data.expenses.rent && <div>🏠 Rent: ${parseFloat(data.expenses.rent).toFixed(2)} ({((parseFloat(data.expenses.rent) / totalSpending) * 100).toFixed(0)}%)</div>}
                {data.expenses.utilities && <div>⚡ Utilities: ${parseFloat(data.expenses.utilities).toFixed(2)} ({((parseFloat(data.expenses.utilities) / totalSpending) * 100).toFixed(0)}%)</div>}
                {data.expenses.groceries && <div>🛒 Groceries: ${parseFloat(data.expenses.groceries).toFixed(2)} ({((parseFloat(data.expenses.groceries) / totalSpending) * 100).toFixed(0)}%)</div>}
                {data.expenses.fun && <div>🎮 Fun: ${parseFloat(data.expenses.fun).toFixed(2)} ({((parseFloat(data.expenses.fun) / totalSpending) * 100).toFixed(0)}%)</div>}
                {Object.entries(data.customExpenses).map(([id, exp]) => (
                  exp.amount && <div key={id}>📌 {exp.name}: ${parseFloat(exp.amount).toFixed(2)} ({((parseFloat(exp.amount) / totalSpending) * 100).toFixed(0)}%)</div>
                ))}
              </div>
            </div>
          )}
            </>
          )}

          {/* SAVINGS TAB */}
          {activeTab === 'savings' && (
            <>
          <div style={{
            background: '#f0fdf4',
            border: '2px solid #22c55e',
            borderRadius: '12px',
            padding: '20px',
            marginBottom: '24px'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: '16px' }}>
              <Zap size={20} style={{ color: '#16a34a', marginRight: '8px' }} />
              <label style={{ fontWeight: 'bold', color: '#15803d', fontSize: '14px' }}>Smart Savings Advisor</label>
            </div>

            <div style={{ marginBottom: '16px' }}>
              <label style={{ fontSize: '13px', color: '#15803d', fontWeight: '500', display: 'block', marginBottom: '8px' }}>
                💾 Your Savings Goal This Month
              </label>
              <input
                type="number"
                value={data.savings}
                onChange={handleSavingsChange}
                placeholder="0"
                style={{
                  width: '100%',
                  padding: '10px',
                  fontSize: '16px',
                  border: '1px solid #bbf7d0',
                  borderRadius: '6px',
                  boxSizing: 'border-box'
                }}
              />
            </div>

            <div style={{
              background: 'white',
              border: '1px solid #bbf7d0',
              borderRadius: '8px',
              padding: '12px',
              marginBottom: '16px'
            }}>
              <p style={{ margin: '0 0 6px 0', fontSize: '12px', color: '#166534', fontWeight: '500' }}>
                Available to Save (Income - Expenses)
              </p>
              <p style={{ margin: 0, fontSize: '24px', fontWeight: 'bold', color: autoCalculatedSavings >= 0 ? '#22c55e' : '#dc2626' }}>
                ${autoCalculatedSavings.toFixed(2)}
              </p>
            </div>
          </div>

          {incomeNum > 0 && (
            <>
              <div style={{
                background: '#eff6ff',
                border: '1px solid #bfdbfe',
                borderRadius: '8px',
                padding: '16px',
                marginBottom: '20px'
              }}>
                <p style={{ margin: '0 0 12px 0', fontWeight: 'bold', color: '#0c4a6e' }}>📊 Your Spending Breakdown</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '13px' }}>
                  {(() => {
                    const expenses = [
                      { name: 'Rent', emoji: '🏠', key: 'rent', amount: parseFloat(data.expenses.rent) || 0 },
                      { name: 'Utilities', emoji: '⚡', key: 'utilities', amount: parseFloat(data.expenses.utilities) || 0 },
                      { name: 'Groceries', emoji: '🛒', key: 'groceries', amount: parseFloat(data.expenses.groceries) || 0 },
                      { name: 'Fun', emoji: '🎮', key: 'fun', amount: parseFloat(data.expenses.fun) || 0 },
                      ...Object.entries(data.customExpenses).map(([id, exp]) => ({
                        name: exp.name,
                        emoji: '📌',
                        key: id,
                        amount: parseFloat(exp.amount) || 0
                      }))
                    ].filter(e => e.amount > 0);

                    const sortedExpenses = [...expenses].sort((a, b) => b.amount - a.amount);

                    return sortedExpenses.map((exp, idx) => {
                      const percentage = ((exp.amount / totalSpending) * 100);
                      return (
                        <div key={exp.key} style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          padding: '10px',
                          background: idx === 0 ? '#fee2e2' : idx === 1 ? '#fef3c7' : '#f5f5f5',
                          borderRadius: '6px'
                        }}>
                          <div>
                            <span style={{ marginRight: '8px' }}>{exp.emoji}</span>
                            <span style={{ fontWeight: idx === 0 ? 'bold' : 'normal', color: idx === 0 ? '#dc2626' : '#333' }}>
                              {exp.name}
                            </span>
                          </div>
                          <div style={{ textAlign: 'right' }}>
                            <div style={{ fontSize: '12px', color: '#666' }}>${exp.amount.toFixed(2)}</div>
                            <div style={{ fontSize: '11px', color: '#999' }}>{percentage.toFixed(0)}% of total</div>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>

              <div style={{
                background: '#faf5ff',
                border: '1px solid #e9d5ff',
                borderRadius: '8px',
                padding: '16px',
                marginBottom: '20px'
              }}>
                <p style={{ margin: '0 0 12px 0', fontWeight: 'bold', color: '#6b21a8' }}>💡 Smart Savings Tips</p>
                <div style={{ fontSize: '13px', color: '#666', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {(() => {
                    const rentPercent = totalSpending > 0 ? (parseFloat(data.expenses.rent) / totalSpending) * 100 : 0;
                    const funPercent = totalSpending > 0 ? (parseFloat(data.expenses.fun) / totalSpending) * 100 : 0;
                    const groceriesPercent = totalSpending > 0 ? (parseFloat(data.expenses.groceries) / totalSpending) * 100 : 0;
                    const utilitiesPercent = totalSpending > 0 ? (parseFloat(data.expenses.utilities) / totalSpending) * 100 : 0;
                    const savingsPercent = totalSpending > 0 ? (manualSavings / incomeNum) * 100 : 0;

                    const tips = [];

                    if (rentPercent > 40) {
                      tips.push({
                        emoji: '🏠',
                        title: 'Rent Alert',
                        text: `Your rent is ${rentPercent.toFixed(0)}% of income. Consider finding a roommate or more affordable housing.`
                      });
                    }

                    if (funPercent > 15) {
                      tips.push({
                        emoji: '🎮',
                        title: 'Entertainment Savings',
                        text: `Fun spending is ${funPercent.toFixed(0)}% of your budget. Try cutting this by 20-30% to save more.`,
                        save: ((parseFloat(data.expenses.fun) * 0.25).toFixed(2))
                      });
                    }

                    if (groceriesPercent > 20) {
                      tips.push({
                        emoji: '🛒',
                        title: 'Grocery Optimization',
                        text: `Your groceries are ${groceriesPercent.toFixed(0)}% of expenses. Meal planning and bulk buying can save you money.`,
                        save: ((parseFloat(data.expenses.groceries) * 0.15).toFixed(2))
                      });
                    }

                    if (utilitiesPercent > 10) {
                      tips.push({
                        emoji: '⚡',
                        title: 'Utilities Reduction',
                        text: `Utilities are ${utilitiesPercent.toFixed(0)}% of expenses. Unplug devices and optimize your usage.`,
                        save: ((parseFloat(data.expenses.utilities) * 0.1).toFixed(2))
                      });
                    }

                    if (savingsPercent < 10 && autoCalculatedSavings > 0) {
                      tips.push({
                        emoji: '🎯',
                        title: 'Savings Target',
                        text: `Aim to save at least 10-20% of your income. You could save $${Math.min(autoCalculatedSavings * 0.15, autoCalculatedSavings).toFixed(2)} this month.`
                      });
                    }

                    if (autoCalculatedSavings > 0 && manualSavings === 0) {
                      tips.push({
                        emoji: '✅',
                        title: 'Quick Win',
                        text: `You have $${autoCalculatedSavings.toFixed(2)} available to save right now. Start by saving just half of it!`
                      });
                    }

                    if (tips.length === 0) {
                      return <p style={{ color: '#999' }}>💰 Great job! Keep tracking your expenses to unlock personalized tips.</p>;
                    }

                    return tips.map((tip, idx) => (
                      <div key={idx} style={{
                        padding: '12px',
                        background: '#f9f9f9',
                        borderRadius: '6px',
                        borderLeft: '3px solid #d8b4fe'
                      }}>
                        <div style={{ fontWeight: 'bold', marginBottom: '4px', color: '#333' }}>
                          {tip.emoji} {tip.title}
                        </div>
                        <div>{tip.text}</div>
                        {tip.save && (
                          <div style={{ marginTop: '6px', color: '#22c55e', fontWeight: 'bold' }}>
                            💚 Potential savings: ${tip.save}
                          </div>
                        )}
                      </div>
                    ));
                  })()}
                </div>
              </div>

              <div style={{
                background: '#f0fdf4',
                border: '1px solid #bbf7d0',
                borderRadius: '8px',
                padding: '16px'
              }}>
                <p style={{ margin: '0 0 12px 0', fontWeight: 'bold', color: '#15803d' }}>📈 Your Savings Progress</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '13px', color: '#333' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>Monthly Income:</span>
                    <strong style={{ color: '#0284c7' }}>${incomeNum.toFixed(2)}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>Total Expenses:</span>
                    <strong style={{ color: '#dc2626' }}>${totalSpending.toFixed(2)}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', paddingTop: '8px', borderTop: '1px solid #bbf7d0' }}>
                    <span>Available to Save:</span>
                    <strong style={{ color: '#22c55e' }}>${autoCalculatedSavings.toFixed(2)}</strong>
                  </div>
                  {manualSavings > 0 && (
                    <div style={{ display: 'flex', justifyContent: 'space-between', color: '#059669' }}>
                      <span>Your Savings Goal:</span>
                      <strong>${manualSavings.toFixed(2)}</strong>
                    </div>
                  )}
                  {manualSavings > 0 && (
                    <div style={{ marginTop: '8px', padding: '10px', background: 'white', borderRadius: '6px', textAlign: 'center' }}>
                      <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>Savings Rate</div>
                      <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#22c55e' }}>
                        {((manualSavings / incomeNum) * 100).toFixed(1)}%
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </>
          )}
            </>
          )}

          {/* CALENDAR TAB */}
          {activeTab === 'calendar' && (
            <>
          <div style={{
            background: '#f5f3ff',
            border: '2px solid #a78bfa',
            borderRadius: '12px',
            padding: '20px',
            marginBottom: '20px'
          }}>
            <h3 style={{ margin: '0 0 16px 0', color: '#6b21a8', fontSize: '16px' }}>📅 Daily Spending Calendar</h3>
            
            <div style={{ marginBottom: '20px' }}>
              {(() => {
                const year = parseInt(currentMonth.split('-')[0]);
                const month = parseInt(currentMonth.split('-')[1]) - 1;
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();
                
                const days = [];
                
                for (let i = 0; i < startingDayOfWeek; i++) {
                  days.push(null);
                }
                
                for (let day = 1; day <= daysInMonth; day++) {
                  days.push(day);
                }
                
                const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                
                return (
                  <div>
                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: 'repeat(7, 1fr)',
                      gap: '8px',
                      marginBottom: '10px'
                    }}>
                      {weekDays.map(day => (
                        <div key={day} style={{
                          textAlign: 'center',
                          fontWeight: 'bold',
                          fontSize: '12px',
                          color: '#6b21a8',
                          padding: '8px'
                        }}>
                          {day}
                        </div>
                      ))}
                    </div>
                    
                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: 'repeat(7, 1fr)',
                      gap: '8px'
                    }}>
                      {days.map((day, idx) => {
                        if (!day) {
                          return <div key={`empty-${idx}`} style={{ minHeight: '80px' }}></div>;
                        }
                        
                        const dateStr = `${currentMonth}-${String(day).padStart(2, '0')}`;
                        const dayData = data.daily[dateStr];
                        const dailyAmount = (dayData && dayData.total) ? dayData.total : 0;
                        
                        return (
                          <div
                            key={day}
                            onClick={() => setSelectedDay(selectedDay === dateStr ? null : dateStr)}
                            style={{
                              minHeight: '80px',
                              padding: '8px',
                              background: dailyAmount > 0 ? '#fef3c7' : '#f9f9f9',
                              border: selectedDay === dateStr ? '2px solid #a78bfa' : '1px solid #e5e5e5',
                              borderRadius: '8px',
                              cursor: 'pointer',
                              display: 'flex',
                              flexDirection: 'column',
                              justifyContent: 'space-between',
                              transition: 'all 0.2s'
                            }}
                          >
                            <div style={{ fontWeight: 'bold', color: '#333', fontSize: '14px' }}>
                              {day}
                            </div>
                            {dailyAmount > 0 && (
                              <div style={{
                                fontSize: '13px',
                                fontWeight: 'bold',
                                color: '#b45309',
                                marginTop: '4px'
                              }}>
                                ${dailyAmount.toFixed(2)}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
            </div>

            {selectedDay && (
              <div style={{
                background: 'white',
                border: '1px solid #e9d5ff',
                borderRadius: '8px',
                padding: '16px',
                marginBottom: '20px'
              }}>
                <h4 style={{ margin: '0 0 12px 0', color: '#6b21a8' }}>
                  📍 {new Date(selectedDay + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' })}
                </h4>
                
                {data.daily[selectedDay] ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '13px' }}>
                    {Object.entries(data.daily[selectedDay].breakdown).map(([category, amount]) => (
                      <div key={category} style={{
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        padding: '8px',
                        background: '#f9f9f9',
                        borderRadius: '6px'
                      }}>
                        <span>{category}</span>
                        <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                          <strong style={{ color: '#b45309' }}>${amount.toFixed(2)}</strong>
                          <button
                            onClick={() => {
                              const updated = { ...data.daily };
                              const newBreakdown = { ...data.daily[selectedDay].breakdown };
                              delete newBreakdown[category];
                              
                              if (Object.keys(newBreakdown).length === 0) {
                                delete updated[selectedDay];
                              } else {
                                updated[selectedDay].breakdown = newBreakdown;
                                updated[selectedDay].total = Object.values(newBreakdown).reduce((sum, val) => sum + val, 0);
                              }
                              
                              updateMonthData({ daily: updated });
                            }}
                            style={{
                              background: '#fee2e2',
                              border: 'none',
                              borderRadius: '4px',
                              cursor: 'pointer',
                              padding: '4px 8px',
                              fontSize: '11px',
                              color: '#dc2626',
                              fontWeight: 'bold'
                            }}
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                    ))}
                    <div style={{
                      borderTop: '1px solid #e5e5e5',
                      paddingTop: '8px',
                      marginTop: '8px',
                      display: 'flex',
                      justifyContent: 'space-between',
                      fontWeight: 'bold',
                      color: '#b45309'
                    }}>
                      <span>Total:</span>
                      <span>${data.daily[selectedDay].total.toFixed(2)}</span>
                    </div>
                  </div>
                ) : (
                  <p style={{ color: '#999', margin: 0 }}>No spending recorded this day</p>
                )}

                <div style={{ marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #e9d5ff' }}>
                  <p style={{ fontSize: '12px', color: '#666', marginBottom: '10px', fontWeight: 'bold' }}>Add spending for this day:</p>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <select
                      id="dayCategory"
                      style={{
                        flex: 1,
                        padding: '6px',
                        fontSize: '13px',
                        border: '1px solid #e9d5ff',
                        borderRadius: '4px',
                        boxSizing: 'border-box'
                      }}
                    >
                      <option value="">Select category</option>
                      <option value="Rent">🏠 Rent</option>
                      <option value="Utilities">⚡ Utilities</option>
                      <option value="Groceries">🛒 Groceries</option>
                      <option value="Fun">🎮 Fun</option>
                      <option value="Food">🍽️ Food</option>
                      <option value="Transport">🚗 Transport</option>
                      <option value="Other">📌 Other</option>
                    </select>
                    <input
                      id="dayAmount"
                      type="number"
                      placeholder="Amount"
                      style={{
                        width: '80px',
                        padding: '6px',
                        fontSize: '13px',
                        border: '1px solid #e9d5ff',
                        borderRadius: '4px',
                        boxSizing: 'border-box'
                      }}
                    />
                    <button
                      onClick={() => {
                        const category = document.getElementById('dayCategory').value;
                        const amount = document.getElementById('dayAmount').value;
                        if (category && amount) {
                          const daily = { ...data.daily };
                          
                          if (!daily[selectedDay]) {
                            daily[selectedDay] = { breakdown: {} };
                          }
                          
                          if (!daily[selectedDay].breakdown[category]) {
                            daily[selectedDay].breakdown[category] = 0;
                          }
                          
                          daily[selectedDay].breakdown[category] += parseFloat(amount);
                          daily[selectedDay].total = Object.values(daily[selectedDay].breakdown).reduce((sum, val) => sum + val, 0);
                          
                          updateMonthData({ daily });
                          document.getElementById('dayCategory').value = '';
                          document.getElementById('dayAmount').value = '';
                        }
                      }}
                      style={{
                        padding: '6px 12px',
                        background: '#a78bfa',
                        color: 'white',
                        border: 'none',
                        borderRadius: '4px',
                        cursor: 'pointer',
                        fontWeight: 'bold',
                        fontSize: '13px'
                      }}
                    >
                      Add
                    </button>
                  </div>
                </div>
              </div>
            )}

            <div style={{
              background: '#faf5ff',
              border: '1px solid #e9d5ff',
              borderRadius: '8px',
              padding: '16px'
            }}>
              <p style={{ margin: '0 0 12px 0', fontWeight: 'bold', color: '#6b21a8' }}>📊 Calendar Summary</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '13px', color: '#333' }}>
                {(() => {
                  const totalDailySpending = Object.values(data.daily).reduce((sum, day) => sum + (day.total || 0), 0);
                  const daysWithSpending = Object.keys(data.daily).length;
                  const avgDaily = daysWithSpending > 0 ? totalDailySpending / daysWithSpending : 0;
                  
                  return (
                    <>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span>Days with spending:</span>
                        <strong>{daysWithSpending}</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span>Total tracked daily:</span>
                        <strong style={{ color: '#b45309' }}>${totalDailySpending.toFixed(2)}</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span>Average per day:</span>
                        <strong>${avgDaily.toFixed(2)}</strong>
                      </div>
                      {totalDailySpending > 0 && (
                        <p style={{ 
                          fontSize: '12px', 
                          color: '#666', 
                          margin: '8px 0 0 0',
                          fontStyle: 'italic'
                        }}>
                          💡 Track daily spending to spot patterns and manage your budget better!
                        </p>
                      )}
                    </>
                  );
                })()}
              </div>
            </div>
          </div>
            </>
          )}
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FinanceTracker />);
  </script>
</body>
</html>
